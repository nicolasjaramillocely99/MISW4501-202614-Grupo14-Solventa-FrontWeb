<dialog
  #dialogo
  class="modal"
  aria-labelledby="titulo-secreto-emitido"
  aria-describedby="aviso-secreto-emitido"
  (cancel)="alCancelarNativo($event)"
  *transloco="let t; prefix: 'socios.secreto'"
>
  @if (secreto(); as datos) {
    <div class="modal__contenido">
      <header class="modal__encabezado">
        <h2 id="titulo-secreto-emitido" class="modal__titulo">{{ t('titulo') }}</h2>
      </header>

      <div id="aviso-secreto-emitido" class="aviso aviso--advertencia" role="alert">
        <svg lucideTriangleAlert [size]="20" aria-hidden="true"></svg>
        <div>
          <p class="aviso__titulo">{{ t('avisoTitulo') }}</p>
          <p>{{ t('avisoTexto') }}</p>
        </div>
      </div>

      <dl class="valores">
        <div class="valor">
          <dt>{{ t('clientId') }}</dt>
          <dd>
            <code class="valor__texto">{{ datos.clientId }}</code>
            <button type="button" class="boton boton--secundario" (click)="copiar('clientId')">
              <svg lucideCopy [size]="16" aria-hidden="true"></svg>
              {{ t('copiarClientId') }}
            </button>
          </dd>
        </div>
        <div class="valor">
          <dt>{{ t('clientSecret') }}</dt>
          <dd>
            <code class="valor__texto" data-testid="secreto-valor">{{ datos.clientSecret }}</code>
            <button type="button" class="boton boton--secundario" (click)="copiar('secreto')">
              <svg lucideCopy [size]="16" aria-hidden="true"></svg>
              {{ t('copiarSecreto') }}
            </button>
          </dd>
        </div>
      </dl>

      <p class="modal__texto">{{ t('uso', { cabecera: datos.cabecera }) }}</p>
      <p class="visualmente-oculto" role="status">
        @if (copiado(); as que) {
          {{ t('copiado.' + que) }}
        }
      </p>

      <div class="modal__acciones">
        <button type="button" class="boton boton--primario" (click)="confirmar()">{{ t('confirmar') }}</button>
      </div>
    </div>
  }
</dialog>
