version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - angular-eslint
      pruebas:
        patterns:
          - vitest
          - '@testing-library/*'
          - '@playwright/test'
          - '@axe-core/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
