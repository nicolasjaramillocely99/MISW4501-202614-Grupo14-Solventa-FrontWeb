name: Corrida nocturna · Cliente web

on:
  schedule:
    # 01:23 America/Bogota (06:23 UTC), fuera de la hora en punto: GitHub retrasa los programados al inicio de cada
    # hora cuando hay carga. Los programados usan este archivo tal como está en la rama por defecto del repo, que es
    # develop (decisión del 2026-10-17), así que un cambio aquí rige al integrarse en develop. Cada job descarga develop
    # de forma explícita. Los resultados se revisan al inicio de la jornada.
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: URL del ambiente a probar (vacío = servidor local de desarrollo)
        required: false
        default: ''

jobs:
  verificar:
    name: Lint · Build · Unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Código fuente
        uses: actions/checkout@v4
        with:
          # La corrida nocturna prueba la rama de integración; bajo demanda, la rama elegida.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm 11
        run: npm install -g npm@11

      - name: Dependencias
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npm run lint

      - name: Build de producción
        run: npm run build -- --configuration production

      - name: Pruebas unitarias con cobertura (umbral ≥ 70 %)
        run: npm test -- --coverage

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-unitarias
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: Flujos críticos y accesibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Código fuente
        uses: actions/checkout@v4
        with:
          # La corrida nocturna prueba la rama de integración; bajo demanda, la rama elegida.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm 11
        run: npm install -g npm@11

      - name: Dependencias
        run: npm ci

      - name: Navegador de referencia (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url }}
        run: npx playwright test

      - name: Reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  dependencias:
    name: Dependencias · npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Código fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: npm 11
        run: npm install -g npm@11

      - name: Vulnerabilidades conocidas (falla con altas o críticas)
        run: npm audit --audit-level=high
