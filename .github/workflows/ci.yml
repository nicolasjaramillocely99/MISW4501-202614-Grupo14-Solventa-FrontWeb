name: CI · Cliente web

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint · Build · Unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Código fuente
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm 11
        run: npm install -g npm@11

      - name: Dependencias
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npm run lint

      - name: Build de producción
        run: npm run build -- --configuration production

      - name: Pruebas unitarias con cobertura (umbral ≥ 70 %)
        run: npm test -- --coverage

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-unitarias
          path: coverage/
          if-no-files-found: ignore
