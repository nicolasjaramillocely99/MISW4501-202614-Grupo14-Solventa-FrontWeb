name: CD · Portal web · staging

# Publica el portal en staging (S3 + CloudFront) bajo demanda, desde develop (T5). Lo despacha
# scripts/environment/up.sh staging del repositorio backend (gh workflow run) o una persona desde GitHub.
# No hay CD hacia main ni hacia production-demo: lo hace el pipeline de main (#68); production-demo se publica con
# scripts/publicar-portal.sh desde un build local de main (scripts/environment/up.sh production-demo).
# Sin llaves guardadas en GitHub: el job asume por OIDC el rol de staging, que solo confía en develop.

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente donde se publica (solo staging)
        type: choice
        options: [staging]
        default: staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-portal-${{ inputs.ambiente || 'staging' }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar el portal en staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Solo desde develop
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::cd-portal.yml publica staging solo desde develop (rama actual: ${GITHUB_REF})."
          exit 1

      - name: Código fuente
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm 11
        run: npm install -g npm@11

      - name: Dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build -- --configuration production

      - name: Credenciales de AWS (OIDC, rol de staging)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::368083581678:role/solventa-github-actions-web-stg
          aws-region: us-east-2

      - name: Publicar en S3 y refrescar CloudFront
        run: bash scripts/publicar-portal.sh staging
